# Kept as a fallback target; Heroku is the primary host (PRD decision 17).
#
# NOTE: primary_region was "jnb" on the assumption that Johannesburg, being the
# only African region, beats Europe for Ghana. That assumption is unverified and
# probably wrong: West African traffic is routinely backhauled to London or
# Amsterdam over submarine cable, so Accra -> Johannesburg often transits Europe
# anyway. Frankfurt is the safer default until someone measures RTT from an
# actual Accra connection.
app = "edubot-africa"
primary_region = "fra"

[build]

[env]
  EDUBOT_ENVIRONMENT = "production"

[http_service]
  internal_port = 8000
  force_https = true
  auto_start_machines = true
  # A tutor that takes 30s to wake is worse than no tutor. Keep one machine warm.
  auto_stop_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
