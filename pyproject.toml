[project]
name = "edubot-africa"
version = "0.1.0"
description = "AI maths tutor grounded in the Ghanaian JHS (B7-B9) curriculum"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pdfplumber>=0.11.10",
    "sympy>=1.14.0",
    "anthropic>=1.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2>=0.28",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
