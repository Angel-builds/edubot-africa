[project]
name = "edubot-africa"
version = "0.1.0"
description = "AI maths tutor grounded in the Ghanaian JHS (B7-B9) curriculum"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sympy>=1.14.0",
    "anthropic>=1.8.0",
    # httpx 2.x renamed both distribution and import. It arrives anyway as an
    # anthropic dependency, but core.llm calls Fireworks with it directly, so
    # it is declared rather than borrowed.
    "httpx2>=2.0",
]

[dependency-groups]
# Building the corpus needs a PDF parser; serving it does not. Keeping these
# out of the runtime image saves about 50 MB of pdfminer, pillow and pypdfium2.
ingest = [
    "pdfplumber>=0.11.10",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false
default-groups = ["dev", "ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
